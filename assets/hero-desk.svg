<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="100%" height="100%" fill="none">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#254A38" flood-opacity="0.08"/>
    </filter>
    <filter id="bookShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="12" stdDeviation="16" flood-color="#27332C" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAEDEF"/>
      <stop offset="60%" stop-color="#FAF9F5"/>
      <stop offset="100%" stop-color="#DCEADD"/>
    </linearGradient>
    <linearGradient id="laptopScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F6F5EE"/>
    </linearGradient>
  </defs>

  <!-- Nền bàn bo góc mềm mại -->
  <rect x="10" y="10" width="660" height="480" rx="32" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="660" height="480" rx="32" stroke="#E6E8E1" stroke-width="1.5"/>

  <!-- Vệt trang trí nền nhẹ nhàng -->
  <circle cx="130" cy="110" r="70" fill="#F3D9E2" opacity="0.45"/>
  <circle cx="580" cy="400" r="90" fill="#DCEADD" opacity="0.5"/>

  <!-- Laptop mở phía góc phải -->
  <g transform="translate(420, 90)">
    <!-- Đế laptop -->
    <path d="M-10 240 L190 240 L170 252 L10 252 Z" fill="#D3D6CB"/>
    <rect x="0" y="240" width="180" height="8" rx="3" fill="#E6E8E1"/>
    <!-- Màn hình laptop -->
    <rect x="15" y="20" width="170" height="220" rx="8" fill="#254A38" filter="url(#softShadow)"/>
    <rect x="23" y="28" width="154" height="204" rx="4" fill="url(#laptopScreen)"/>
    <!-- Nội dung Word trên laptop -->
    <rect x="33" y="38" width="80" height="12" rx="3" fill="#47765B"/>
    <rect x="33" y="58" width="134" height="6" rx="2" fill="#E6E8E1"/>
    <rect x="33" y="70" width="120" height="6" rx="2" fill="#E6E8E1"/>
    <rect x="33" y="82" width="130" height="6" rx="2" fill="#E6E8E1"/>
    <rect x="33" y="100" width="60" height="8" rx="2" fill="#F3D9E2"/>
    <rect x="33" y="116" width="134" height="6" rx="2" fill="#E6E8E1"/>
    <rect x="33" y="128" width="126" height="6" rx="2" fill="#E6E8E1"/>
    <rect x="33" y="140" width="118" height="6" rx="2" fill="#E6E8E1"/>
    <rect x="33" y="160" width="134" height="50" rx="4" fill="#DCEADD" opacity="0.6"/>
  </g>

  <!-- Cốc cà phê / trà màu hồng pastel -->
  <g transform="translate(365, 140)">
    <!-- Quai cốc -->
    <path d="M42 25 C58 25 58 55 42 55" stroke="#F3D9E2" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- Thân cốc -->
    <path d="M0 10 L44 10 L38 65 C37 72 30 76 22 76 C14 76 7 72 6 65 Z" fill="#F3D9E2" filter="url(#softShadow)"/>
    <ellipse cx="22" cy="10" rx="22" ry="6" fill="#FAEDEF"/>
    <ellipse cx="22" cy="10" rx="18" ry="4" fill="#6B4E3D"/>
    <!-- Hơi nóng hình trái tim -->
    <path d="M18 -5 C18 -12 12 -12 12 -7 C12 -3 18 2 18 2 C18 2 24 -3 24 -7 C24 -12 18 -12 18 -5 Z" fill="#F3D9E2" opacity="0.8"/>
  </g>

  <!-- Chậu cây mini / Succulent -->
  <g transform="translate(540, 40)">
    <!-- Chậu cây -->
    <path d="M10 50 L50 50 L44 90 C43 96 38 100 30 100 C22 100 17 96 16 90 Z" fill="#DCEADD" filter="url(#softShadow)"/>
    <!-- Đất -->
    <ellipse cx="30" cy="50" rx="20" ry="6" fill="#667169"/>
    <!-- Lá cây xanh mướt -->
    <path d="M30 46 C20 30 15 15 28 8 C35 15 35 35 30 46Z" fill="#47765B"/>
    <path d="M28 48 C12 40 4 30 10 20 C20 22 25 38 28 48Z" fill="#A8D5BA"/>
    <path d="M32 48 C48 40 56 30 50 20 C40 22 35 38 32 48Z" fill="#254A38"/>
  </g>

  <!-- Cuốn sách/giáo án mở to ở trung tâm -->
  <g transform="translate(140, 190)" filter="url(#bookShadow)">
    <!-- Bìa sau -->
    <path d="M-8 10 C80 18 160 8 185 15 L185 240 C160 230 80 238 -8 230 Z" fill="#254A38"/>
    <path d="M378 10 C290 18 210 8 185 15 L185 240 C210 230 290 238 378 230 Z" fill="#254A38"/>
    
    <!-- Trang sách trái -->
    <path d="M0 16 C80 24 150 16 182 22 L182 232 C150 226 80 232 0 224 Z" fill="#FFFFFF"/>
    <!-- Trang sách phải -->
    <path d="M370 16 C290 24 220 16 188 22 L188 232 C220 226 290 232 370 224 Z" fill="#FAF9F5"/>

    <!-- Gáy sách -->
    <rect x="182" y="20" width="6" height="213" fill="#D3D6CB"/>

    <!-- Nội dung trang trái -->
    <rect x="25" y="38" width="90" height="12" rx="3" fill="#254A38"/>
    <rect x="25" y="60" width="135" height="5" rx="2" fill="#E6E8E1"/>
    <rect x="25" y="74" width="125" height="5" rx="2" fill="#E6E8E1"/>
    <rect x="25" y="88" width="140" height="5" rx="2" fill="#E6E8E1"/>
    <rect x="25" y="102" width="130" height="5" rx="2" fill="#E6E8E1"/>
    <rect x="25" y="116" width="110" height="5" rx="2" fill="#E6E8E1"/>

    <rect x="25" y="136" width="60" height="8" rx="2" fill="#47765B"/>
    <rect x="25" y="152" width="138" height="5" rx="2" fill="#E6E8E1"/>
    <rect x="25" y="166" width="128" height="5" rx="2" fill="#E6E8E1"/>
    <rect x="25" y="180" width="132" height="5" rx="2" fill="#E6E8E1"/>
    <rect x="25" y="194" width="95" height="5" rx="2" fill="#E6E8E1"/>

    <!-- Nội dung trang phải -->
    <rect x="210" y="38" width="85" height="10" rx="3" fill="#47765B"/>
    <rect x="210" y="58" width="135" height="5" rx="2" fill="#E6E8E1"/>
    <rect x="210" y="72" width="140" height="5" rx="2" fill="#E6E8E1"/>
    <rect x="210" y="86" width="120" height="5" rx="2" fill="#E6E8E1"/>
    <rect x="210" y="100" width="130" height="5" rx="2" fill="#E6E8E1"/>

    <!-- Hình vẽ hoa văn minh họa trên trang sách phải -->
    <rect x="210" y="122" width="135" height="75" rx="6" fill="#FAEDEF"/>
    <circle cx="277" cy="155" r="18" fill="#F3D9E2"/>
    <path d="M277 142 V168 M264 155 H290" stroke="#47765B" stroke-width="2" stroke-linecap="round"/>

    <!-- Dải ruy băng đánh dấu trang -->
    <path d="M185 22 L185 260 L193 250 L201 260 L201 22 Z" fill="#F3D9E2"/>
  </g>

  <!-- Hộp bút & thước kẻ góc trái -->
  <g transform="translate(60, 290)">
    <rect x="0" y="40" width="45" height="75" rx="8" fill="#FFFFFF" stroke="#E6E8E1" stroke-width="1.5" filter="url(#softShadow)"/>
    <!-- Bút chì / thước chìa ra -->
    <rect x="10" y="8" width="6" height="50" rx="2" fill="#47765B" transform="rotate(-8 10 8)"/>
    <rect x="22" y="0" width="7" height="60" rx="2" fill="#F3D9E2" transform="rotate(4 22 0)"/>
    <rect x="30" y="12" width="5" height="45" rx="2" fill="#254A38" transform="rotate(12 30 12)"/>
  </g>

  <!-- Giấy ghi chú dán (Sticky Note / Callout) với chữ viết tay nghệ thuật -->
  <g transform="translate(320, 32)" filter="url(#softShadow)">
    <rect x="0" y="0" width="220" height="96" rx="14" fill="#FFFFFF" stroke="#F3D9E2" stroke-width="2"/>
    <!-- Ghim giấy nhỏ -->
    <circle cx="110" cy="10" r="4" fill="#F3D9E2"/>
    <!-- Nội dung thư pháp tiếng Việt thanh lịch -->
    <text x="110" y="36" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="13" fill="#254A38">Tài liệu chất lượng</text>
    <text x="110" y="58" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" fill="#667169">Hỗ trợ giảng dạy &amp; học tập</text>
    <text x="110" y="78" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#47765B">hiệu quả hơn ♡</text>
  </g>
</svg>
